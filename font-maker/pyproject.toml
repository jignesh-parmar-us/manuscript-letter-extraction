[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "font-maker"
version = "0.1.0"
description = "Build an installable font from a book's letter groups (reads the letter-extractor library read-only)."
requires-python = ">=3.10"
dependencies = ["letter-extractor", "fastapi>=0.110", "uvicorn>=0.29", "sqlalchemy>=2.0", "fonttools>=4.50",
                "potracer>=0.0.4"]

[project.optional-dependencies]
test = ["httpx>=0.27", "uharfbuzz>=0.40"]

[project.gui-scripts]
font-maker = "font_maker.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"font_maker" = ["static/*.html", "static/assets/*", "data/*"]
